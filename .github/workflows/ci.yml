name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest flake8 black
      - name: Lint with flake8
        run: flake8 netscope/ tests/ --max-line-length=120 --exclude=__pycache__
      - name: Format check with black
        run: black --check netscope/ tests/
      - name: Run tests
        run: pytest -v
