[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "1.0.1"
description = "Web inspector for analyzing websites, technologies, and security"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MiVink"}
]
keywords = ["security", "web", "inspector", "dns", "tls", "http", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "dnspython>=2.6.0",
    "cryptography>=42.0.0",
    "python-whois>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "black>=24.0",
]

[project.scripts]
netscope = "netscope.cli:app"

[project.urls]
Homepage = "https://github.com/MiVink/NetScope"
Repository = "https://github.com/MiVink/NetScope"

[tool.setuptools.packages.find]
where = ["."]
include = ["netscope*"]
exclude = ["tests*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
